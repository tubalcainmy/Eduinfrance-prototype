<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Study France Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: sample landing page and form on the left, a "behind the scenes" panel on the right. Colors match the flow map tiers. */
:root {
  --bg: #f7f8f6; --surface: #ffffff; --surface2: #eef1ee; --fg: #14201d; --muted: #52605b;
  --line: #c9d1cc; --line-strong: #7b8a84; --launch: #0f766e; --convert: #b45309; --full: #1d4ed8;
  --chip-fg: #ffffff; --danger: #b42318; --ok: #166534; --ok-bg: #e6f4ea; --warn-bg: #fff4e0; --full-bg: #e8eefc;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #151d1b; --surface2: #1c2623; --fg: #e8efec; --muted: #a2b0aa;
    --line: #31403b; --line-strong: #6d7f78; --launch: #5eead4; --convert: #fbbf24; --full: #93c5fd;
    --chip-fg: #0b1220; --danger: #fda29b; --ok: #86efac; --ok-bg: #12301f; --warn-bg: #33250d; --full-bg: #16233f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #151d1b; --surface2: #1c2623; --fg: #e8efec; --muted: #a2b0aa;
  --line: #31403b; --line-strong: #6d7f78; --launch: #5eead4; --convert: #fbbf24; --full: #93c5fd;
  --chip-fg: #0b1220; --danger: #fda29b; --ok: #86efac; --ok-bg: #12301f; --warn-bg: #33250d; --full-bg: #16233f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.5;
  padding-block: 0 96px; margin: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ribbon { background: var(--fg); color: var(--bg); font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em;
  padding: 8px 16px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); text-align: center; }
.bar { max-width: 1180px; margin: 18px auto 0; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.bar .grp { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; background: var(--surface); color: var(--fg); border: 0; padding: 8px 14px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button.fg[aria-pressed="true"] { background: var(--full); color: var(--chip-fg); }
.seg button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, .opt:has(input:focus-visible), a:focus-visible { outline: 3px solid var(--launch); outline-offset: 2px; }
.lbl { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-right: 8px; }
.tierinfo { max-width: 1180px; margin: 14px auto 0; border: 1px solid var(--line); border-left-width: 6px; border-radius: 6px; padding: 12px 16px; background: var(--surface); font-size: 14px; }
.tierinfo.launch { border-left-color: var(--launch); } .tierinfo.convert { border-left-color: var(--convert); }
.tierinfo.full { border-left-color: var(--full); background: var(--full-bg); }
.tierinfo b { font-size: 15px; }
.grid { max-width: 1180px; margin: 22px auto 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
@media (max-width: 960px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.grid:has(#side[hidden]) { grid-template-columns: minmax(0, 1fr); max-width: 820px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px; }
.card.fullcard { border-color: var(--full); border-width: 2px; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h1 { font-size: clamp(26px, 4vw, 34px); line-height: 1.15; margin: 4px 0 10px; font-weight: 600; text-wrap: balance; }
h2 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
h3 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
p { margin: 0 0 10px; } .muted { color: var(--muted); } .small { font-size: 14px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.vsl { aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; display: grid; place-items: center; position: relative; margin: 14px 0 6px; }
.vsl .play { width: 64px; height: 64px; border-radius: 50%; background: var(--launch); display: grid; place-items: center; }
.vsl .play::after { content: ""; border-left: 20px solid var(--chip-fg); border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 5px; }
.vsl .tag { position: absolute; left: 12px; bottom: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.q { border: 0; padding: 0; margin: 0 0 20px; min-width: 0; }
.q legend, .q > label.t { font-weight: 600; padding: 0; margin-bottom: 8px; display: block; }
.req::after { content: " *"; color: var(--danger); }
.opts { display: grid; gap: 8px; }
.opts.two { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; background: var(--surface); }
.opt:has(input:checked) { border-color: var(--launch); box-shadow: inset 0 0 0 1px var(--launch); background: var(--surface2); }
.opt:has(input:disabled) { opacity: 0.55; cursor: not-allowed; }
.opt input { margin-top: 4px; accent-color: var(--launch); }
.opt .s { display: block; font-size: 13px; color: var(--muted); }
input[type=text], input[type=email], input[type=tel], select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--fg); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 18px; margin-bottom: 20px; }
.fields .q { margin: 0; }
.btn { font: inherit; font-weight: 600; padding: 11px 18px; border-radius: 6px; border: 1px solid var(--launch); background: var(--launch); color: var(--chip-fg); cursor: pointer; }
.btn.alt { background: transparent; color: var(--fg); border-color: var(--line-strong); }
.btn.fullbtn { background: var(--full); border-color: var(--full); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; padding: 2px 8px; border-radius: 3px; color: var(--chip-fg); display: inline-block; }
.chip.l { background: var(--launch); } .chip.c { background: var(--convert); } .chip.f { background: var(--full); }
.err { color: var(--danger); font-size: 14px; margin: 0 0 14px; }
.note { background: var(--warn-bg); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
.okbox { background: var(--ok-bg); border-radius: 6px; padding: 12px 14px; }
.sum { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; background: var(--surface2); padding: 10px 12px; border-radius: 6px; margin-bottom: 18px; }
.sum a { color: var(--full); }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 12px 0; }
.wa { background: var(--surface2); border-radius: 8px; padding: 14px; }
.bubble { background: var(--ok-bg); border-radius: 10px 10px 2px 10px; padding: 10px 12px; max-width: 420px; margin-left: auto; font-size: 15px; white-space: pre-wrap; }
.pay { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 16px; }
.side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 960px) { .side { position: static; } }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.log { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 12px; display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow: auto; }
.log li { overflow-wrap: anywhere; }
.log .f { color: var(--full); } .log .c { color: var(--convert); } .log .x { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll { overflow-x: auto; }
.callouts { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.callouts li { border-left: 3px solid var(--convert); padding: 6px 12px; background: var(--surface2); border-radius: 0 6px 6px 0; }
.why { border-left: 4px solid var(--launch); background: var(--surface2); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 14px; margin: 0; }
.why.convert { border-left-color: var(--convert); } .why.full { border-left-color: var(--full); background: var(--full-bg); }
.why .h { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; font-weight: 600; }
.why p { margin: 0 0 4px; } .why p:last-child { margin: 0; }
.cookie { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 3px solid var(--full); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: center; font-size: 14px; z-index: 5; }
.cookie p { margin: 0; max-width: 640px; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 14px; background: var(--surface); }
.lead { font-size: 17px; color: var(--muted); }
.file { border: 1px dashed var(--line-strong); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
</style>


</head>
<body>
<div class="ribbon">PROTOTYPE · SAMPLE DATA · NOTHING YOU TYPE IS SENT OR SAVED</div>
<div class="bar">
  <div class="grp">
    <div class="seg" role="group" aria-label="Which view to show">
      <button type="button" data-action="tab" data-v="proposed" aria-pressed="true">Proposed</button>
      <button type="button" data-action="tab" data-v="plan" id="planTab" class="fg" aria-pressed="false">Plan page</button>
      <button type="button" data-action="tab" data-v="today" aria-pressed="false">Today</button>
    </div>
    <div class="seg" role="group" aria-label="Explanations">
      <button type="button" data-action="why" id="whyBtn" aria-pressed="true">Why each step: on</button>
    </div>
  </div>
  <div id="tierBar"><span class="lbl">Show as</span>
    <span class="seg" role="group" aria-label="Which package to show">
      <button type="button" data-action="tier" data-v="launch" aria-pressed="false">Launch</button>
      <button type="button" data-action="tier" data-v="convert" aria-pressed="false">Convert</button>
      <button type="button" data-action="tier" data-v="full" class="fg" aria-pressed="true">Full growth</button>
    </span>
  </div>
</div>
<div id="tierInfo"></div>
<div class="grid">
  <main id="main" class="stack" aria-live="polite"></main>
  <aside id="side" class="side" aria-label="Behind the scenes"></aside>
</div>
<div id="cookie"></div>

<script>
(function () {
  var BRAND = "Sample Study Advisors";
  var HEARD = ["Website", "Flier", "Instagram", "X (Twitter)", "YouTube", "TikTok", "LinkedIn", "Brand Ambassador (Divine)", "Facebook", "Dr Bashar Gulumbe's Facebook page", "Family or friends"];
  var INTAKES = [
    { v: "March intake", s: "Closed", off: true },
    { v: "May to July intake", s: "Extremely limited options" },
    { v: "September/October intake", s: "Application is open" },
    { v: "January 2027 intake", s: "Opening mid-July" },
    { v: "September 2027 intake", s: "Opening in October 2026" },
    { v: "None of the above (other destinations)", s: "" }
  ];
  var AGES = [
    { v: "u18", t: "Below 18 years" }, { v: "18-24", t: "18 to 24 years" }, { v: "25-34", t: "25 to 34 years" },
    { v: "35-39", t: "35 to 39 years" }, { v: "40-45", t: "40 to 45 years" }, { v: "45+", t: "45 years and above" }
  ];
  var NEEDS = [
    { v: "study", t: "Study in France", s: "Admission and visa, private or public university" },
    { v: "phd", t: "PhD or doctorate", s: "Starts with an eligibility check" },
    { v: "visa", t: "Visa help only", s: "You already have an admission" },
    { v: "housing", t: "Housing or arrival help", s: "Accommodation, inspection, airport pick-up" },
    { v: "unsure", t: "Not sure yet, talk to an advisor first", s: "Consultation only" },
    { v: "spain", t: "Spain instead (Bachelor and Master's)", s: "An advisor will share the options" }
  ];
  var PLANS = {
    standard: { n: "Standard: consultation only", p: "₦100,000" },
    reassess: { n: "Visa re-application assessment and evaluation only", p: "₦100,000" },
    reapp: { n: "Visa re-application service only", p: "₦400,000 or 400 euros" },
    phdcheck: { n: "PhD pre-engagement eligibility check (consultation session)", p: "₦100,000" },
    bronze: { n: "Bronze: admission + visa application (private schools)", p: "₦550,000" },
    pubadm: { n: "Public school admission only", p: "₦500,000" },
    silver: { n: "Silver: public school admission + visa application", p: "₦750,000" },
    premium: { n: "Premium: all of the above except visa re-application and PhD", p: "850 euros or ₦1.2M" },
    visa: { n: "Visa application support only", p: "₦350,000" },
    acc: { n: "Accommodation support only (complete plan)", p: "250 euros" },
    inspect: { n: "Accommodation inspection only", p: "150 euros (Paris) or 100 euros (other cities)" },
    pickup: { n: "Pick-up and arrival service, with African meal (Montpellier only)", p: "100 to 250 euros" },
    spain: { n: "Spain option (Bachelor and Master's only)", p: "" }
  };
  var SLOTS = ["Mon, 10:00", "Mon, 14:00", "Tue, 11:00", "Wed, 09:30", "Wed, 16:00", "Thu, 12:00"];
  var ROUTE_NAME = { A: "Paid services", B: "Plan packages", C: "Support-only", D: "Not a fit" };
  var TIER_INFO = {
    launch: ["Launch", "launch", "The guided page, both form steps, routing, advisor alert, WhatsApp ending and funnel tracking. After Step 2, an advisor follows up by hand."],
    convert: ["Convert", "convert", "Everything in Launch, plus Zoom or Google Meet booking, Paystack payment and follow-up for booked calls."],
    full: ["Full growth", "full", "Everything in Convert, plus the rebuilt onboarding page, rebuilt plan pages and site, SEO foundation, tracking on every page, Meta Pixel and Conversion API, and a cookie consent banner. Look for the blue labels: the <b>Plan page</b> tab, the cookie banner and the onboarding preview."]
  };
  var PLANPAGES = {
    bronze: { name: "Bronze plan", who: "Private universities (Management and IT programmes). HND accepted.", incl: ["Application fee waiver", "Study commitment assessment", "Interview coaching", "Detailed application information", "Visa application guidance"], plan: "bronze", ages: "Bachelor's up to 25, Master's up to 35" },
    silver: { name: "Silver plan", who: "Public universities (Sciences, Management, IT and more).", incl: ["School search across three tuition categories", "Detailed application information", "Interview coaching", "Visa application guidance and interview preparation"], plan: "silver", ages: "Bachelor's up to 25, Master's up to 32" }
  };

  var state;
  function fresh(tab, tier, why, cc) {
    return { tab: tab || "proposed", tier: tier || "full", why: why !== false, cc: cc || null, screen: "landing", s1: {}, f: {}, route: null, errors: [], events: [], lead: null, endStep: null, slot: null, meet: "Zoom", wa: false, planpage: "bronze", ob: {} };
  }
  state = fresh();
  var clock = 0;
  function track(name, params, tier) {
    clock += 2 + Math.floor(Math.random() * 5);
    state.events.push({ t: clock, name: name, params: params || "", tier: tier || "l" });
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function chip(t) { return t === "launch" ? '<span class="chip l">LAUNCH</span>' : t === "convert" ? '<span class="chip c">CONVERT</span>' : '<span class="chip f">FULL GROWTH</span>'; }
  function label(list, v, key) { for (var i = 0; i < list.length; i++) if (list[i].v === v) return list[i][key || "t"]; return v || ""; }
  function getBy(path) { var p = path.split("."), o = state; for (var i = 0; i < p.length; i++) { if (o == null) return ""; o = o[p[i]]; } return o == null ? "" : o; }
  function setBy(path, v) { var p = path.split("."), o = state; for (var i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = v; }

  /* ---------- explanation block ---------- */
  function why(tier, title, whyText, problem) {
    if (!state.why) return "";
    return '<aside class="why ' + (tier === "full" ? "full" : tier === "convert" ? "convert" : "") + '"><div class="h">' + chip(tier) + "<span>Why this step exists: " + esc(title) + "</span></div><p>" + whyText + "</p><p><b>Problem it removes:</b> " + problem + "</p></aside>";
  }

  function routeOf(s) {
    if (s.age === "u18") return "D";
    if (s.denied === "yes") return "A";
    return { study: "B", phd: "A", visa: "C", housing: "C", unsure: "A", spain: "C" }[s.need];
  }
  function plansFor(route, s) {
    if (route === "A") {
      if (s.denied === "yes") return ["reassess", "reapp"];
      if (s.need === "phd") return ["phdcheck"];
      return ["standard"];
    }
    if (route === "B") return ["bronze", "pubadm", "silver", "premium"];
    if (s.need === "visa") return ["visa"];
    if (s.need === "housing") return ["acc", "inspect", "pickup"];
    return ["spain"];
  }

  /* ---------- views ---------- */
  function radio(name, field, v, text, sub, checked, off) {
    return '<label class="opt"><input type="radio" name="' + name + '" data-field="' + field + '" value="' + esc(v) + '"' + (checked ? " checked" : "") + (off ? " disabled" : "") + '><span>' + esc(text) + (sub ? '<span class="s">' + esc(sub) + "</span>" : "") + "</span></label>";
  }
  function field(path, id, labelText, type, extra) {
    return '<div class="q"><label class="t req" for="' + id + '">' + labelText + '</label><input id="' + id + '" type="' + type + '" data-field="' + path + '" value="' + esc(getBy(path)) + '" ' + (extra || "") + "></div>";
  }
  function landing() {
    var s = state.s1, h = "";
    h += '<section class="card"><div class="eyebrow">' + esc(BRAND) + ' · France</div><h1>Find your route to France in two short steps</h1>';
    h += '<p class="muted">Watch the video, tell us who you are and what you need, then answer the questions that apply to you.</p>';
    h += '<div class="vsl" role="img" aria-label="Placeholder for the explainer video"><div class="play"></div><span class="tag">VSL placeholder · 5 to 10 minutes</span></div>';
    h += '<p class="small muted">The video explains the process and who each plan suits. Your own recording goes here.</p></section>';
    h += why("launch", "the video", "It explains the process, the plans and who each one suits before the applicant fills in anything.", "Applicants submit without understanding the plans, and advisors repeat the same basics on every call.");
    h += '<section class="card"><div class="row" style="justify-content:space-between"><h2>Step 1 of 2 · Quick check</h2>' + chip("launch") + "</div>";
    h += '<p class="small muted">Your details and three quick questions. Your answers are saved as soon as you continue.</p>';
    if (state.errors.length) h += '<p class="err" role="alert">' + esc(state.errors.join(" ")) + "</p>";
    h += '<div class="fields">' + field("s1.name", "s1name", "Name (first name and surname)", "text", 'autocomplete="name"') + field("s1.email", "s1email", "Email", "email", 'autocomplete="email"') + field("s1.phone", "s1phone", "Phone number (we call only if we need clarification)", "tel", 'autocomplete="tel"') + "</div>";
    h += '<fieldset class="q"><legend class="req">What do you need help with?</legend><div class="opts">';
    NEEDS.forEach(function (n) { h += radio("need", "s1.need", n.v, n.t, n.s, s.need === n.v); });
    h += '</div></fieldset><fieldset class="q"><legend class="req">Age range</legend><div class="opts two">';
    AGES.forEach(function (a) { h += radio("age", "s1.age", a.v, a.t, "", s.age === a.v); });
    h += '</div></fieldset><fieldset class="q"><legend class="req">Have you been denied a visa by a Schengen country before? (visit, study or work)</legend><div class="opts two">';
    h += radio("denied", "s1.denied", "no", "No", "", s.denied === "no") + radio("denied", "s1.denied", "yes", "Yes", "We will point you to the re-application route", s.denied === "yes");
    h += '</div></fieldset><label class="opt" style="margin-bottom:20px"><input type="checkbox" data-field="s1.consent"' + (s.consent ? " checked" : "") + '><span>I agree that my details are saved so an advisor can follow up if I do not finish. <span class="s">Privacy notice link goes here. Your team approves the wording.</span></span></label>';
    h += '<div class="row"><button class="btn" type="button" data-action="step1">Continue</button><span class="small muted">Takes about a minute</span></div></section>';
    h += why("launch", "Step 1", "It saves the applicant's contact details and asks the three questions that decide their route. The details are stored the moment they continue.", "A Google form records nothing until the last Submit, so anyone who leaves part-way is lost. Unqualified leads, such as under 18, are also caught here, with their details kept.");
    return h;
  }
  function step2() {
    var r = state.route, s = state.s1, f = state.f, h = "";

  function act(a, v) {

    if (a === "why") { state.why = !state.why; render(); return; }
    if (a === "cc") { state.cc = v; track("consent " + (v === "yes" ? "accepted" : "declined"), "", v === "yes" ? "f" : "x"); render(); return; }
    if (a === "pp") { state.planpage = v; render(); return; }
    if (a === "startflow") { state.tab = "proposed"; render(); window.scrollTo(0, 0); return; }

    if (a === "step1") {
      state.errors = validate1();
      if (state.errors.length) { render(); window.scrollTo(0, 0); return; }
      var s = state.s1;
      state.route = routeOf(s);

  function setPressed(sel, attr, val) {
    var els = document.querySelectorAll(sel);
    for (var i = 0; i < els.length; i++) els[i].setAttribute("aria-pressed", els[i].getAttribute(attr) === val);
  }
  function render() {
    var full = state.tier === "full";
    document.getElementById("planTab").hidden = !full;
    setPressed("[data-action=tab]", "data-v", state.tab);
    setPressed("[data-action=tier]", "data-v", state.tier);
    document.getElementById("whyBtn").setAttribute("aria-pressed", state.why);
    document.getElementById("whyBtn").textContent = "Why each step: " + (state.why ? "on" : "off");
    document.getElementById("tierBar").hidden = state.tab === "today";
    document.getElementById("tierInfo").innerHTML = state.tab === "today" ? "" : tierInfo();
    var main = document.getElementById("main");
    if (state.tab === "today") main.innerHTML = today();
    else if (state.tab === "plan" && full) main.innerHTML = planPage();
    else if (state.screen === "landing") main.innerHTML = landing();
    else if (state.screen === "step2") main.innerHTML = step2();
    else if (state.screen === "left") main.innerHTML = leftView();
    else main.innerHTML = endView() + '<div class="row"><button class="btn alt" type="button" data-action="reset">Start over</button></div>';
    var sd = document.getElementById("side");
    sd.innerHTML = (state.tab === "today" || state.tab === "plan") ? "" : side();
    sd.hidden = state.tab === "today" || state.tab === "plan";
    document.getElementById("cookie").innerHTML = cookie();
  }
  startFlow();
  render();
})();
</script>
</body>
</html>
